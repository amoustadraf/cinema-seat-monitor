name: Odyssey IMAX 70mm Seat Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub cron is UTC. Offset from the top of the hour to reduce queue delays.
    - cron: "7,37 * * * *"

concurrency:
  group: odyssey-seat-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Restore monitor state
        uses: actions/cache@v6
        with:
          path: .monitor-cache
          key: odyssey-seat-state-${{ github.run_id }}
          restore-keys: |
            odyssey-seat-state-

      - name: Run tests
        run: npm test

      - name: Send Discord connection test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[discord-test]')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
        run: npm run notify-test

      - name: Run seat monitor
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[discord-test]')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          CINEPLEX_API_KEY: ${{ secrets.CINEPLEX_API_KEY }}
          ODYSSEY_STATE_FILE: .monitor-cache/monitor.state.json
          ODYSSEY_LOG_FILE: .monitor-cache/monitor.log
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            npm run check
          else
            npm run check:now
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: odyssey-monitor-diagnostics
          path: .monitor-cache
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Discord on failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          payload=$(jq -n \
            --arg mention "$DISCORD_MENTION" \
            --arg run_url "$RUN_URL" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "${SHORT_SHA:0:7}" \
            --arg repository "$GITHUB_REPOSITORY" \
            '{
              content: (($mention + "\n🚨 **Odyssey monitor needs attention.**") | ltrimstr("\n")),
              allowed_mentions: {parse: ["users", "roles"]},
              embeds: [{
                title: "Odyssey monitor failed",
                url: $run_url,
                description: ("The scheduled cinema scan did not finish successfully.\n\n[**Open the failed GitHub Actions run →**](" + $run_url + ")"),
                color: 15158332,
                fields: [
                  {name: "Workflow", value: $workflow, inline: true},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Commit", value: $commit, inline: true},
                  {name: "Repository", value: $repository, inline: false}
                ],
                footer: {text: "The next scheduled run will try again automatically."}
              }]
            }')
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "${DISCORD_WEBHOOK_URL}?wait=true"
