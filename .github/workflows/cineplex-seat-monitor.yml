name: Cineplex Seat Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub cron is UTC. Offset from the top of the hour to reduce queue delays.
    - cron: "7,37 * * * *"

concurrency:
  group: cineplex-seat-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Restore monitor state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .monitor-cache
          key: cinema-seat-state-${{ github.run_id }}
          restore-keys: |
            cinema-seat-state-
            odyssey-seat-state-

      - name: Run tests
        run: npm test

      - name: Send Discord connection test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[discord-test]')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
        run: npm run notify-test

      - name: Run seat monitor
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[discord-test]')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          CINEPLEX_API_KEY: ${{ secrets.CINEPLEX_API_KEY }}
          CINEMA_MONITOR_STATE_FILE: .monitor-cache/monitor.state.json
          CINEMA_MONITOR_LOG_FILE: .monitor-cache/monitor.log
        shell: bash
        run: npm run check:now

      - name: Save monitor state
        if: always() && hashFiles('.monitor-cache/monitor.state.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .monitor-cache
          key: cinema-seat-state-${{ github.run_id }}

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cinema-monitor-diagnostics
          path: .monitor-cache
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  notify-failure:
    name: Notify Discord on failure
    needs: check
    if: always() && needs.check.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - name: Read configured movie name
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Send failure alert
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          movie_name=$(jq -r '.movie.name // empty' monitor.config.json 2>/dev/null || true)
          monitor_name=${movie_name:-Cinema seat monitor}
          payload=$(jq -n \
            --arg mention "$DISCORD_MENTION" \
            --arg monitor_name "$monitor_name" \
            --arg run_url "$RUN_URL" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "${SHORT_SHA:0:7}" \
            --arg repository "$GITHUB_REPOSITORY" \
            '{
              content: (($mention + "\n🚨 **" + $monitor_name + " monitor needs attention.**") | ltrimstr("\n")),
              allowed_mentions: {parse: ["users", "roles"]},
              embeds: [{
                title: ($monitor_name + " monitor failed"),
                url: $run_url,
                description: ("The scheduled cinema scan did not finish successfully.\n\n[**Open the failed GitHub Actions run →**](" + $run_url + ")"),
                color: 15158332,
                fields: [
                  {name: "Workflow", value: $workflow, inline: true},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Commit", value: $commit, inline: true},
                  {name: "Repository", value: $repository, inline: false}
                ],
                footer: {text: "The next scheduled run will try again automatically."}
              }]
            }')
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "${DISCORD_WEBHOOK_URL}?wait=true"
